# Plate format rules used by src/inference/plate_postprocess.py.
#
# These mirror the two patterns already validated in utils.check_license_plate_pattern:
#   pattern1: 4 digits + 3 letters      e.g. 5545GZN
#   pattern2: 2 letters + 4 digits + 2 letters   e.g. MA4844CC
#
# 'D' = digit position, 'L' = letter position. length is len(format).
# Corrections are only applied to a character when the position's expected
# class (digit/letter) disagrees with what OCR produced, so a correction never
# fires on an already-valid character.

formats:
  - name: pattern1
    format: "DDDDLLL"
  - name: pattern2
    format: "LLDDDDLL"

# Visually-confusable glyph pairs. Only used to fix a character that violates
# its expected class for the matched format above (e.g. an "O" expected to be
# a digit becomes "0"), never applied speculatively.
confusion_map:
  digit_to_letter:
    "0": "O"
    "1": "I"
    "5": "S"
    "8": "B"
    "2": "Z"
  letter_to_digit:
    "O": "0"
    "I": "1"
    "S": "5"
    "B": "8"
    "Z": "2"
